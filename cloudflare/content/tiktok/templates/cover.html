<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>Houdini Analytics — Portada TikTok</title>
  <style>
    :root {
      --bg: #050505;
      --red: #e11d2e;
      --red-soft: rgba(225, 29, 46, 0.55);
      --white: #f5f5f5;
      --muted: #9a9a9a;
      --fog: rgba(255, 255, 255, 0.04);
      --font: "Segoe UI", "Arial", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font);
      color: var(--white);
    }

    .slide {
      position: relative;
      width: 1080px;
      height: 1920px;
      background:
        radial-gradient(ellipse 70% 45% at 50% 42%, rgba(80, 10, 18, 0.45), transparent 70%),
        radial-gradient(ellipse 50% 35% at 50% 55%, var(--fog), transparent 65%),
        #050505;
      overflow: hidden;
    }

    /* Soft analytics / pitch motifs (cover DNA without heavy candlesticks) */
    .motif {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.9;
    }

    .shard {
      position: absolute;
      width: 420px;
      height: 8px;
      background: linear-gradient(90deg, transparent, #fff, var(--red), transparent);
      transform-origin: center;
      filter: blur(0.3px);
      opacity: 0.85;
    }
    .shard--tl { top: 180px; left: -40px; transform: rotate(-28deg); }
    .shard--tl2 { top: 220px; left: 40px; width: 280px; height: 4px; opacity: 0.45; transform: rotate(-28deg); background: linear-gradient(90deg, transparent, var(--red), transparent); }
    .shard--br { bottom: 260px; right: -60px; transform: rotate(-28deg); }
    .shard--br2 { bottom: 300px; right: 20px; width: 260px; height: 4px; opacity: 0.4; transform: rotate(-28deg); background: linear-gradient(90deg, transparent, #fff, transparent); }

    .bars {
      position: absolute;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      opacity: 0.35;
    }
    .bars span {
      display: block;
      width: 14px;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(180deg, var(--red), #666);
    }
    .bars--tl { top: 120px; left: 70px; }
    .bars--tl span:nth-child(1) { height: 36px; }
    .bars--tl span:nth-child(2) { height: 58px; }
    .bars--tl span:nth-child(3) { height: 44px; background: linear-gradient(180deg, #bbb, #444); }
    .bars--tl span:nth-child(4) { height: 78px; }
    .bars--tl span:nth-child(5) { height: 52px; background: linear-gradient(180deg, #888, #333); }
    .bars--br { bottom: 180px; right: 80px; }
    .bars--br span:nth-child(1) { height: 48px; }
    .bars--br span:nth-child(2) { height: 72px; }
    .bars--br span:nth-child(3) { height: 40px; background: linear-gradient(180deg, #aaa, #444); }
    .bars--br span:nth-child(4) { height: 88px; }
    .bars--br span:nth-child(5) { height: 60px; }

    .trend {
      position: absolute;
      width: 380px;
      height: 120px;
      opacity: 0.4;
    }
    .trend--tl { top: 280px; left: 40px; }
    .trend--br { bottom: 340px; right: 30px; transform: scaleX(-1); }

    .pitch {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 720px;
      height: 720px;
      transform: translate(-50%, -54%);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      opacity: 0.55;
    }
    .pitch::before {
      content: "";
      position: absolute;
      inset: 18%;
      border: 1px solid rgba(225, 29, 46, 0.12);
      border-radius: 50%;
    }
    .pitch::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
    }

    .brand {
      position: absolute;
      top: 420px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
    }
    .brand img {
      width: 420px;
      height: 420px;
      object-fit: contain;
      filter: drop-shadow(0 0 40px rgba(225, 29, 46, 0.25));
    }

    .copy {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 980px;
      text-align: center;
    }

    .eyebrow {
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      color: var(--white);
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .title {
      font-size: 92px;
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1.05;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .date {
      font-size: 92px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--red);
      line-height: 1.05;
      margin-bottom: 56px;
    }

    .cta {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: var(--white);
      text-transform: uppercase;
    }
    .cta span { margin-left: 10px; color: var(--red); }
  </style>
</head>
<body>
  <div class="slide" data-slide="cover">
    <div class="motif" aria-hidden="true">
      <div class="pitch"></div>
      <div class="shard shard--tl"></div>
      <div class="shard shard--tl2"></div>
      <div class="shard shard--br"></div>
      <div class="shard shard--br2"></div>
      <div class="bars bars--tl"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="bars bars--br"><span></span><span></span><span></span><span></span><span></span></div>
      <svg class="trend trend--tl" viewBox="0 0 380 120" fill="none">
        <path d="M0 90 C40 88 55 40 95 55 C130 70 145 20 190 35 C235 50 250 95 300 70 C330 55 355 40 380 48" stroke="#e11d2e" stroke-width="3" opacity="0.9"/>
        <path d="M0 100 C50 98 70 70 110 78 C155 88 170 50 220 60 C270 70 300 100 380 72" stroke="#888" stroke-width="2" opacity="0.55"/>
      </svg>
      <svg class="trend trend--br" viewBox="0 0 380 120" fill="none">
        <path d="M0 70 C45 55 70 95 115 80 C160 65 180 25 230 40 C275 55 310 90 380 50" stroke="#e11d2e" stroke-width="3" opacity="0.85"/>
      </svg>
    </div>

    <div class="brand">
      <img src="{{LOGO_URL}}" alt="Houdini Analytics" />
    </div>

    <div class="copy">
      <p class="eyebrow">{{EYEBROW}}</p>
      <h1 class="title">{{TITLE}}</h1>
      <p class="date">{{DATE}}</p>
      <p class="cta">{{CTA}} <span>→</span></p>
    </div>
  </div>
</body>
</html>
